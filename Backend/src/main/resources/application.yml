server:
  port: 8080

spring:
  application:
    name: assessment-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/healthwise
      auto-index-creation: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false

healthwise:
  assessment:
    default-version: v1

cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175

jwt:
  # HS256 shared secret - MUST be >= 256 bits (32+ chars) of high-entropy random data.
  # Generate with e.g. `openssl rand -base64 48`. Never commit a real value.
  secret: ${JWT_SECRET:dev-only-insecure-default-change-me-please-32chars+}
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  # Refresh TTL used when the "Remember me" checkbox is NOT checked (short/session-like).
  refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:1}

mail:
  # If host is blank/unset, MailService falls back to logging emails to the console
  # instead of sending them, so registration/reset flows are testable without real SMTP.
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from-address: ${MAIL_FROM_ADDRESS:no-reply@healthwise.ai}
  smtp-auth: ${MAIL_SMTP_AUTH:true}
  smtp-starttls: ${MAIL_SMTP_STARTTLS:true}

google:
  # Placeholder - create a real OAuth 2.0 Client ID (Web application type) in Google
  # Cloud Console and set GOOGLE_CLIENT_ID before Google sign-in will actually verify.
  client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id.apps.googleusercontent.com}

app:
  # Used to build the password-reset link e.g. {frontend-base-url}/reset-password?token=...
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  # Used to build the email-verification link, which points at this backend directly.
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8080}

auth:
  cookie:
    name: refresh_token
    secure: ${AUTH_COOKIE_SECURE:false}       # true in prod (HTTPS); false for localhost http dev
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}   # Lax for localhost cross-port; None+Secure=true for real cross-site prod
    # Refresh TTL used when "Remember me" IS checked at login (persistent cookie).
    remember-me-ttl-days: ${AUTH_REMEMBER_ME_TTL_DAYS:30}
  lockout:
    max-failed-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
    lockout-duration-minutes: ${AUTH_LOCKOUT_DURATION_MINUTES:15}
